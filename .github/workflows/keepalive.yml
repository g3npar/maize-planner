# Pings the hosted planner server so Render's free tier doesn't put it to
# sleep (it sleeps after 15 minutes without traffic, and waking takes 30-60 s).
# Uses the same PLANNER_API_URL repository variable as the Pages workflow.
#
# GitHub runs scheduled workflows only from the default branch, may start them
# a few minutes late, and turns them off after 60 days without commits to the
# repo (re-enable under Actions → Keep server awake).
name: Keep server awake

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

permissions: {}

concurrency:
  group: keepalive
  cancel-in-progress: true

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      SERVER: ${{ vars.PLANNER_API_URL }}
    steps:
      - name: Ping the planner server
        run: |
          if [ -z "$SERVER" ]; then
            echo "::warning::PLANNER_API_URL is not set; nothing to ping."
            exit 0
          fi
          # A sleeping server can take a minute to wake, so allow for that.
          status=$(curl -s -o /dev/null -w "%{http_code}" -m 120 --retry 2 --retry-delay 10 "${SERVER%/}/")
          echo "Server answered HTTP $status"
          if [ "$status" -ge 500 ] || [ "$status" = "000" ]; then
            echo "::warning::The planner server answered HTTP $status"
          fi
