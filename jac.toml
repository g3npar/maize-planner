[project]
name = "personal-planner"
version = "0.1.0"
description = "Maize Planner: classes, Canvas / Gradescope / Autograder deadlines, grades and AI study plans - web, mobile and CLI on one Jac server"
default-app = "web"
jac-version = "==0.37.21"

[apps]
[apps.planner]
kind = "service"
entry-point = "core.planner"

[apps.web]
kind = "web-app"
entry-point = "web.main"

[apps.cli]
kind = "cli"
entry-point = "cli.main"

[apps.mobile]
kind = "mobile"
entry-point = "mobile.main"
# Jac 0.37.21: `jac run --dev mobile` starts its API backend as a plain
# `jac run --serve mobile/main.jac`, which for a native platform builds and
# installs an Android app (needs the Android SDK) instead of serving, so the
# phone can't sign in. With "web" here that backend just serves the API; the
# dev command itself gets `--platform auto` (see README) to stay React Native.
platform = "web"

[dependencies]
[dependencies.npm]
react-native-web = "^0.21.2"
lucide-react = "^0.469.0"
react = "^19.2.0"
react-dom = "^19.2.0"
react-router-dom = "^6.22.0"
react-error-boundary = "^5.0.0"
"@tanstack/react-form" = "^1.33.0"
zod = "^4.3.6"

[dependencies.npm.dev]
vite = "^6.4.1"
"@vitejs/plugin-react" = "^4.7.0"
typescript = "^5.3.3"
"@types/react" = "^19.2.0"
"@types/react-dom" = "^19.2.0"

[dev-dependencies]
watchdog = ">=3.0.0"

[test]
directories = ["core", "cli"]

[client.app_meta_data]
title = "Maize Planner"
description = "Canvas, Gradescope and Autograder deadlines, class schedule, grades and AI study plans."
theme_color = "#1d4ed8"

[apps.mobile.dependencies]
[apps.mobile.dependencies.npm]
react-native-svg = "^15.13.0"
lucide-react = "^0.469.0"
lucide-react-native = "^0.469.0"

[apps.mobile.dependencies.npm.native]
react-native-svg = "^15.13.0"
lucide-react-native = "^0.469.0"

[byllm]
[byllm.call_params]
temperature = 0.3

[scale.admin]
enabled = false

[environments.response.headers]
"Access-Control-Allow-Headers" = "Content-Type, Authorization, X-Request-Id, X-Jac-Endpoint"
